services:
  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/medilink}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks: [medilink]

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on: [server]
    restart: unless-stopped
    networks: [medilink]

  mongo:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [medilink]

volumes:
  mongodb_data:

networks:
  medilink:
    driver: bridge
